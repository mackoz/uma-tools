name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Every app with a build.mjs is rebuilt in CI and none of their bundles
      # are tracked in git (see .gitignore) — this workflow is their only
      # build path. build-planner is the one holdout: its source doesn't
      # compile against the current uma-skill-tools layout, so its bundle
      # stays committed as-is. See docs/apps.md for the full explanation.
      - name: Build umalator
        run: node build.mjs
        working-directory: umalator

      - name: Build umalator-global
        run: node build.mjs
        working-directory: umalator-global

      - name: Build skill-visualizer-global
        run: node build.mjs
        working-directory: skill-visualizer-global

      - name: Build skill-visualizer
        run: node build.mjs
        working-directory: skill-visualizer

      - name: Build courseimages
        run: node build.mjs
        working-directory: courseimages

      - name: Build rougelike
        run: node build.mjs
        working-directory: rougelike

      - name: Build umadle
        run: node build.mjs
        working-directory: umadle

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
