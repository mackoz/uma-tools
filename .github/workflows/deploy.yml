name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Only the apps with a build.mjs are rebuilt in CI. umadle depends on a
      # package that isn't in package.json (see docs/apps.md) and the rest are
      # .bat-only, Windows-oriented build scripts — those ship whatever's
      # already committed. See docs/deployment.md for the full explanation.
      - name: Build umalator
        run: node build.mjs
        working-directory: umalator

      - name: Build umalator-global
        run: node build.mjs
        working-directory: umalator-global

      - name: Build skill-visualizer-global
        run: node build.mjs
        working-directory: skill-visualizer-global

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
