name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Skip the rebuild+redeploy when a push touches only docs -- nothing under docs/
    # is served by any deployed app, so there's nothing for Pages to pick up. Only
    # skips if EVERY file in the push matches; a push that also touches real source
    # still builds. Caveat: if this workflow is ever made a required PR status check,
    # a doc-only PR would leave that check permanently pending (a known GitHub Actions
    # paths-ignore gotcha) -- not applicable today since this only runs on push to
    # master, not on PRs.
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      # Every app with a build.mjs is rebuilt in CI and none of their bundles
      # are tracked in git (see .gitignore) — this workflow is their only
      # build path. build-planner is the one holdout: its source doesn't
      # compile against the current uma-skill-tools layout, so its bundle
      # stays committed as-is. See docs/apps.md for the full explanation.
      - name: Build umalator
        run: node build.mjs
        working-directory: umalator

      - name: Build umalator-global
        run: node build.mjs
        working-directory: umalator-global

      - name: Build skill-visualizer-global
        run: node build.mjs
        working-directory: skill-visualizer-global

      - name: Build skill-visualizer
        run: node build.mjs
        working-directory: skill-visualizer

      - name: Build courseimages
        run: node build.mjs
        working-directory: courseimages

      - name: Build rougelike
        run: node build.mjs
        working-directory: rougelike

      - name: Build umadle
        run: node build.mjs
        working-directory: umadle

      # Pages serves this repo's tree directly (each app at its own root-relative
      # path, e.g. /umalator-global/) so `path: .` below can't be narrowed to a
      # single dist folder -- but that also means every non-served directory
      # rides along unless removed first, and upload-pages-artifact@v3 has no
      # path-exclude option of its own to filter one out. Two independent
      # problems, found back to back on 2026-09-02:
      #   - node_modules (now including playwright) grew past whatever size/
      #     file-count limit that action enforces, failing the archive outright.
      #   - .claude/skills/handoff and .claude/skills/claude-handoff are
      #     symlinks into .agents/skills/, which stopped being tracked in the
      #     same push (see uma-tools-plans PIPE-40) -- a fresh CI checkout never
      #     materializes a gitignored path, so on the runner they're pure
      #     dangling symlinks, and `tar` aborts the whole archive on the first
      #     one it can't stat ("File removed before we read it"), not just that
      #     one entry. Fixing PIPE-40 properly (making them real files, or
      #     dropping them) would also fix this, but .claude/ has no business
      #     being served by Pages either way -- it's Claude Code tooling
      #     config, not app content -- so removing the whole directory here is
      #     the more robust fix: correct regardless of what .claude/ contains
      #     later, not contingent on every symlink inside it staying valid.
      - name: Remove build-time-only / non-served directories before archiving for Pages
        run: rm -rf node_modules .claude

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
